<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070c18; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  input { font-family: inherit; }
  input::placeholder { color: #536176; }
  button:focus-visible, input:focus-visible { outline: 2px solid #34c967; outline-offset: 2px; }
  @keyframes rsSpin { to { transform: rotate(360deg); } }
  .rs-spin { animation: rsSpin .8s linear infinite; transform-origin: 12px 12px; }
  @keyframes rsRise { from { opacity:0; transform: translateY(10px) scale(.96);} to {opacity:1; transform:none;} }
  .rs-rise { animation: rsRise .6s cubic-bezier(.2,.7,.2,1) both; }
  @media (min-width: 760px){
    body { background:#04060c; }
    #root > div { max-width: 560px; margin-left:auto; margin-right:auto;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 30px 80px rgba(0,0,0,.6); }
    #root > div.rs-wide { max-width: 1040px; }
  }
